# Phase 5 — Quality, Benchmarking & CI Foundation
#
# Runs the single regression gate (`tools/ci_gate.ps1`), which chains:
#   1. build the DUnitX test project
#   2. run the suite            -> exit 0 and "Tests Leaked : 0"
#   3. build VittixRunner
#   4. run VittixRunner --strict -> exit 0 (pagination baseline reconciled)
#      plus resource thresholds (USER delta = 0, bounded GDI delta)
#   5. packaging smoke (-IncludePackages): runtime pkg, design pkg, designer
#
# REQUIREMENTS
#   A self-hosted Windows runner with RAD Studio / Delphi installed. The gate
#   script locates `rsvars.bat` itself (Studio 23.0, then 22.0) or uses msbuild
#   from PATH. There is no GitHub-hosted Delphi toolchain, so a hosted runner
#   cannot execute these gates.
#
# LOCAL EQUIVALENT
#   powershell -NoProfile -ExecutionPolicy Bypass -File tools\ci_gate.ps1 -IncludePackages
#
# GATES ARE STRUCTURAL: page counts (reports/regression_baselines.json) and
# traversal counters (TReportTraversalDiagnostics) decide pass/fail. Wall-clock
# timings are informational only (`build\phase5-benchmark-timings.txt`).
#
# TRIGGER POLICY (dispatch-only since 2026-11):
#   The push/pull_request triggers are intentionally removed. No licensed
#   self-hosted runner is registered on the repository, and Delphi
#   unattended/build-server licensing remains UNRESOLVED — do not register a
#   runner until written Embarcadero licensing confirmation is obtained (see
#   docs/Release-Status-Record-2026-10-25.md and docs/ci-status-policy.md).
#   Licensing-independent repository hygiene, consistency and documentation
#   checks run automatically via .github/workflows/repo-hygiene.yml instead.
#   Automatic Delphi triggers may be restored only after written licensing
#   approval and runner/security qualification (external-PR approval, service
#   account, secrets and workspace-cleanup review).

name: Build and Test

on:
  workflow_dispatch:

# One gate at a time: the self-hosted runner owns in-use binaries (exes/BPLs),
# so overlapping runs would collide.
concurrency:
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  checks: write

jobs:
  gate:
    # Self-hosted: needs Delphi. The labels must exist on the runner; adjust to
    # match your runner's labels (e.g. [self-hosted, windows, delphi]).
    runs-on: [self-hosted, windows, delphi]
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run Phase 5 regression gate
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\ci_gate.ps1 -IncludePackages

      - name: Publish DUnitX test results
        if: always()
        uses: mikepenz/action-junit-report@db71d41eb79864e25ab0337e395c352e84523afe # v4.3.1
        with:
          report_paths: tests/dunitx-results.xml
          require_tests: false
          check_name: DUnitX test results

      - name: Upload gate artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase5-gate-artifacts
          if-no-files-found: warn
          path: |
            tests/dunitx-results.xml
            build/gate/**
            build/phase5-benchmark-timings.txt
